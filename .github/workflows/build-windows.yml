name: Build Windows Installer

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build installer (NSIS, x64)
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: NeonGrid-Windows-Installer
          path: release/*.exe
          if-no-files-found: error

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Publishes a GitHub release (creating the tag if needed) so the installer
      # has a public direct-download link.
      - name: Publish installer as GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: Neon Grid ${{ steps.ver.outputs.version }}
          body: |
            Windows-11-Installer (x64) für Neon Grid.
            Download: NeonGrid-Setup-${{ steps.ver.outputs.version }}.exe – ausführen und dem Setup folgen.
            Der Installer ist nicht signiert: Bei der SmartScreen-Warnung "Weitere Informationen" → "Trotzdem ausführen".
          files: release/*.exe
          make_latest: true
